<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sudoku Moderno</title>
  <meta name="description" content="Juego interactivo de Sudoku moderno para jugar en la web o en GitHub Pages.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
        </svg>
        <h1 class="logo-title">Sudoku</h1>
      </div>
      <div class="header-actions">
        <button id="btn-theme" class="icon-btn" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none">
            <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="btn-new-game" class="icon-btn" title="Nueva partida" aria-label="Nueva partida">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Difficulty selector -->
    <nav class="difficulty-selector">
      <button class="diff-btn" data-diff="easy">Fácil</button>
      <button class="diff-btn active" data-diff="medium">Medio</button>
      <button class="diff-btn" data-diff="hard">Difícil</button>
      <button class="diff-btn" data-diff="expert">Experto</button>
    </nav>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-item">
        <span>Errores:</span>
        <span id="mistakes-count">0</span>
      </div>
      <div class="status-item">
        <button id="btn-timer" class="timer-btn" title="Pausar juego">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="timer-text">00:00</span>
        </button>
      </div>
    </div>

    <!-- Board -->
    <main class="board-container">
      <div id="board" class="board"></div>

      <!-- Pause Overlay -->
      <div id="pause-overlay" class="pause-overlay">
        <h2>Juego en Pausa</h2>
        <button id="btn-resume" class="pause-btn" title="Continuar">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </button>
      </div>
    </main>

    <!-- Controls -->
    <section class="controls">
      <!-- Action buttons -->
      <div class="action-row">
        <button id="btn-undo" class="action-btn" title="Deshacer (Ctrl+Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v6h6"/>
            <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/>
          </svg>
          <span>Deshacer</span>
        </button>

        <button id="btn-erase" class="action-btn" title="Borrar (Backspace)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 20H7L3 14c-1-1.3-1-3.3 0-4.7l4-5.3c1-1.3 2.7-2 4.3-2h8.7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2z"/>
            <line x1="18" y1="9" x2="12" y2="15"/>
            <line x1="12" y1="9" x2="18" y2="15"/>
          </svg>
          <span>Borrar</span>
        </button>

        <button id="btn-notes" class="action-btn" title="Modo notas (N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
          </svg>
          <span>Notas</span>
        </button>

        <button id="btn-hint" class="action-btn" title="Pista (H)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18h6"/>
            <path d="M10 22h4"/>
            <path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/>
          </svg>
          <span>Pista</span>
        </button>
      </div>

      <!-- Number Pad (1-9) -->
      <div class="numpad-row">
        <button class="num-btn" data-num="1">1<span class="count">-</span></button>
        <button class="num-btn" data-num="2">2<span class="count">-</span></button>
        <button class="num-btn" data-num="3">3<span class="count">-</span></button>
        <button class="num-btn" data-num="4">4<span class="count">-</span></button>
        <button class="num-btn" data-num="5">5<span class="count">-</span></button>
        <button class="num-btn" data-num="6">6<span class="count">-</span></button>
        <button class="num-btn" data-num="7">7<span class="count">-</span></button>
        <button class="num-btn" data-num="8">8<span class="count">-</span></button>
        <button class="num-btn" data-num="9">9<span class="count">-</span></button>
      </div>
    </section>

    <!-- Footer info -->
    <footer class="footer">
      <p>💡 Atajos: Flechas para moverte, 1-9 números, <b>N</b> modo notas, <b>H</b> pista, <b>P</b> pausar.</p>
    </footer>
  </div>

  <!-- Victory Modal -->
  <div id="win-modal" class="modal-overlay">
    <div class="modal-card">
      <div style="font-size: 3rem; margin-bottom: 8px;">🎉</div>
      <h2 class="modal-title">¡Felicidades!</h2>
      <p class="modal-desc">Has resuelto el puzzle con éxito.</p>
      
      <div class="modal-stats">
        <div class="stat-item">
          <span class="stat-label">Tiempo</span>
          <span id="modal-time" class="stat-value">00:00</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Dificultad</span>
          <span id="modal-diff" class="stat-value">MEDIO</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Errores</span>
          <span id="modal-mistakes" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Pistas</span>
          <span id="modal-hints" class="stat-value">0</span>
        </div>
      </div>

      <button id="btn-play-again" class="primary-btn">Jugar de nuevo</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/sudoku.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
